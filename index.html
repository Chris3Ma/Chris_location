<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>To Do</h1>
      <p class="subtitle" id="task-count">0 tasks remaining</p>
    </header>

    <form class="add-form" id="add-form">
      <input
        type="text"
        id="task-input"
        placeholder="What needs to be done?"
        autocomplete="off"
        aria-label="New task"
      />
      <button type="submit" aria-label="Add task">Add</button>
    </form>

    <ul class="task-list" id="task-list"></ul>

    <footer class="footer" id="footer" hidden>
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="completed">Completed</button>
      </div>
      <button class="clear-completed" id="clear-completed">Clear completed</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
